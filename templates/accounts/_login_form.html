<form method="post" action="{% url 'accounts:login' %}" class="auth-form" data-auth-form="login">
    {% csrf_token %}
    {% if request.GET.next %}
        <input type="hidden" name="next" value="{{ request.GET.next }}">
    {% endif %}
    {{ form.as_p }}
    <button type="submit">Войти</button>
</form>
