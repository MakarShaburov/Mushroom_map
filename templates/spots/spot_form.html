{% extends 'base.html' %}
{% block title %}Добавить место{% endblock %}
{% block content %}
<h1>Добавить грибное место</h1>
<p>Кликните на карте, чтобы выбрать координаты.</p>
<div id="map" style="height: 50vh; width: 100%;"></div>

<form method="post">
    {% csrf_token %}
    <p><label>Название: <input type="text" name="title" required></label></p>
    <p><label>Описание: <textarea name="description"></textarea></label></p>
    <p><label>Широта: <input type="text" name="latitude" id="lat" readonly required></label></p>
    <p><label>Долгота: <input type="text" name="longitude" id="lng" readonly required></label></p>
    <button type="submit">Сохранить</button>
</form>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script>
    const map = L.map('map').setView([55.75, 37.62], 10);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap',
    }).addTo(map);

    let marker;
    map.on('click', function (e) {
        document.getElementById('lat').value = e.latlng.lat.toFixed(6);
        document.getElementById('lng').value = e.latlng.lng.toFixed(6);
        if (marker) map.removeLayer(marker);
        marker = L.marker(e.latlng).addTo(map);
    });
</script>
{% endblock %}
