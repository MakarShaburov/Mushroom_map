{% extends 'base.html' %}
{% block title %}Карта грибных мест{% endblock %}
{% block content %}
<div style="position: relative;">
    <div id="map" style="height: 80vh; width: 100%;"></div>

    <button id="search-toggle" style="position: absolute; top: 10px; right: 10px; z-index: 1000; padding: 8px 12px; cursor: pointer;">
        🔍 Поиск
    </button>
    <button id="settings-toggle" style="position: absolute; top: 54px; right: 10px; z-index: 1000; padding: 8px 12px; cursor: pointer;">
        ⚙️ Настройки
    </button>

    <div id="spot-panel" style="display: none; position: absolute; top: 0; left: 0; height: 100%; width: 510px; background: var(--panel-bg); color: var(--text); box-shadow: 2px 0 6px rgba(0,0,0,0.2); z-index: 1000; padding: 16px; box-sizing: border-box; overflow-y: auto;">
        <button id="spot-panel-close" style="float: right; border: none; background: none; font-size: 18px; cursor: pointer; color: var(--text);">✕</button>
        <div id="spot-panel-body">Загрузка…</div>
    </div>

    <div id="search-panel" style="display: none; position: absolute; top: 0; right: 0; height: 100%; width: 300px; background: var(--panel-bg); color: var(--text); box-shadow: -2px 0 6px rgba(0,0,0,0.2); z-index: 1000; padding: 16px; box-sizing: border-box; overflow-y: auto;">
        <button id="search-close" style="float: right; border: none; background: none; font-size: 18px; cursor: pointer; color: var(--text);">✕</button>
        <h3 style="margin-top: 0;">Поиск мест</h3>

        <label for="search-text">Название</label>
        <input type="text" id="search-text" placeholder="Например: полянка" style="width: 100%; box-sizing: border-box; margin-bottom: 12px;">

        <p style="margin-bottom: 4px;">Виды грибов (можно выбрать несколько)</p>
        <div id="search-types" style="margin-bottom: 12px;">
            {% for type in mushroom_types %}
                <label style="display: block; margin-bottom: 4px;">
                    <input type="checkbox" class="type-checkbox" value="{{ type.code }}"> {{ type.name }}
                </label>
            {% endfor %}
        </div>

        <p id="search-count" style="color: var(--muted); font-size: 0.9em;"></p>

        <div id="search-results"></div>
    </div>

    <div id="settings-panel" style="display: none; position: absolute; top: 0; right: 0; height: 100%; width: 260px; background: var(--panel-bg); color: var(--text); box-shadow: -2px 0 6px rgba(0,0,0,0.2); z-index: 1000; padding: 16px; box-sizing: border-box; overflow-y: auto;">
        <button id="settings-close" style="float: right; border: none; background: none; font-size: 18px; cursor: pointer; color: var(--text);">✕</button>
        <h3 style="margin-top: 0;">Настройки</h3>
        <p style="margin-bottom: 6px;">Тема сайта</p>
        <label style="display: block; margin-bottom: 6px;">
            <input type="radio" name="theme" value="light"> Светлая
        </label>
        <label style="display: block;">
            <input type="radio" name="theme" value="dark"> Тёмная
        </label>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map('map').setView([55.75, 37.62], 10); // старт: Москва и область

    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?key={{ carto_api_key }}', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
        subdomains: 'abcd',
        maxZoom: 20,
    }).addTo(map);

    let allSpots = []; // { data, marker }

    // --- Боковая панель с информацией о месте ---
    const panel = document.getElementById('spot-panel');
    const panelBody = document.getElementById('spot-panel-body');
    let currentPanelSpotId = null;

    function openSpotPanel(spotId) {
        currentPanelSpotId = spotId;
        panel.style.display = 'block';
        panelBody.innerHTML = 'Загрузка…';
        fetch(`/spots/${spotId}/panel/`)
            .then(response => response.text())
            .then(html => { panelBody.innerHTML = html; });
    }

    function closeSpotPanel() {
        panel.style.display = 'none';
        currentPanelSpotId = null;
    }

    document.getElementById('spot-panel-close').addEventListener('click', closeSpotPanel);

    function removeSpotFromMap(spotId) {
        const idx = allSpots.findIndex(entry => entry.data.id === spotId);
        if (idx === -1) return;
        map.removeLayer(allSpots[idx].marker);
        allSpots.splice(idx, 1);
        applyFilters();
    }

    // Перехватываем отправку форм внутри панели (оценка, комментарий, удаление),
    // чтобы обновлять панель без перезагрузки страницы.
    panelBody.addEventListener('submit', function (e) {
        const form = e.target;
        if (!form.classList.contains('panel-ajax-form')) return;
        e.preventDefault();

        const isDelete = form.dataset.panelAction === 'delete';
        if (isDelete && !confirm('Удалить это место без возможности восстановления?')) {
            return;
        }

        fetch(form.action, {
            method: 'POST',
            headers: { 'X-Panel-Request': '1' },
            body: new FormData(form),
        }).then(async response => {
            if (isDelete) {
                if (response.ok) {
                    removeSpotFromMap(currentPanelSpotId);
                    closeSpotPanel();
                } else {
                    alert('Не удалось удалить это место.');
                }
                return;
            }
            panelBody.innerHTML = await response.text();
        }).catch(() => {
            alert('Не удалось выполнить действие. Попробуйте ещё раз.');
        });
    });

    // --- Поиск / фильтр ---
    function getSelectedTypes() {
        return Array.from(document.querySelectorAll('.type-checkbox:checked')).map(cb => cb.value);
    }

    function applyFilters() {
        const text = document.getElementById('search-text').value.trim().toLowerCase();
        const selectedTypes = getSelectedTypes();
        let visibleCount = 0;
        const resultsBox = document.getElementById('search-results');
        resultsBox.innerHTML = '';

        allSpots.forEach(entry => {
            const matchesText = !text || entry.data.title.toLowerCase().includes(text);
            // "ИЛИ": показываем место, если оно содержит хотя бы один из отмеченных видов
            const matchesTypes = selectedTypes.length === 0 ||
                entry.data.mushroom_types.some(t => selectedTypes.includes(t));
            const visible = matchesText && matchesTypes;

            if (visible) {
                if (!map.hasLayer(entry.marker)) entry.marker.addTo(map);
                visibleCount += 1;

                const item = document.createElement('div');
                item.style.padding = '6px 0';
                item.style.borderBottom = '1px solid #eee';
                item.innerHTML = `<a href="#">${entry.data.title}</a><br>` +
                                  `<small>${entry.data.mushroom_types_label}</small>`;
                item.style.cursor = 'pointer';
                item.querySelector('a').addEventListener('click', (ev) => {
                    ev.preventDefault();
                    map.setView([entry.data.latitude, entry.data.longitude], 14);
                    openSpotPanel(entry.data.id);
                });
                resultsBox.appendChild(item);
            } else {
                if (map.hasLayer(entry.marker)) map.removeLayer(entry.marker);
            }
        });

        document.getElementById('search-count').textContent = `Найдено мест: ${visibleCount}`;
    }

    fetch("{% url 'spots:spots_api' %}")
        .then(response => response.json())
        .then(data => {
            data.spots.forEach(spot => {
                const marker = L.marker([spot.latitude, spot.longitude]).addTo(map);
                marker.bindTooltip(spot.title);
                marker.on('click', () => openSpotPanel(spot.id));
                allSpots.push({ data: spot, marker: marker });
            });
            applyFilters();
        });

    document.getElementById('search-toggle').addEventListener('click', () => {
        document.getElementById('settings-panel').style.display = 'none';
        document.getElementById('search-panel').style.display = 'block';
    });
    document.getElementById('search-close').addEventListener('click', () => {
        document.getElementById('search-panel').style.display = 'none';
    });
    document.getElementById('search-text').addEventListener('input', applyFilters);
    document.getElementById('search-types').addEventListener('change', applyFilters);

    // --- Настройки: тема сайта ---
    const themeRadios = document.querySelectorAll('input[name="theme"]');

    function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
    }

    document.getElementById('settings-toggle').addEventListener('click', () => {
        document.getElementById('search-panel').style.display = 'none';
        const currentTheme = localStorage.getItem('theme') || 'light';
        themeRadios.forEach(radio => { radio.checked = (radio.value === currentTheme); });
        document.getElementById('settings-panel').style.display = 'block';
    });
    document.getElementById('settings-close').addEventListener('click', () => {
        document.getElementById('settings-panel').style.display = 'none';
    });
    themeRadios.forEach(radio => {
        radio.addEventListener('change', () => applyTheme(radio.value));
    });
</script>
{% endblock %}
