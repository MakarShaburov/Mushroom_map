{% extends 'base.html' %}
{% block title %}Карта грибных мест{% endblock %}
{% block content %}
<div style="position: relative;">
    <div id="map" style="height: 80vh; width: 100%;"></div>

    <button id="search-toggle" style="position: absolute; top: 10px; right: 10px; z-index: 1000; padding: 8px 12px; cursor: pointer;">
        🔍 Поиск
    </button>

    <div id="search-panel" style="display: none; position: absolute; top: 0; right: 0; height: 100%; width: 300px; background: white; box-shadow: -2px 0 6px rgba(0,0,0,0.2); z-index: 1000; padding: 16px; box-sizing: border-box; overflow-y: auto;">
        <button id="search-close" style="float: right; border: none; background: none; font-size: 18px; cursor: pointer;">✕</button>
        <h3 style="margin-top: 0;">Поиск мест</h3>

        <label for="search-text">Название</label>
        <input type="text" id="search-text" placeholder="Например: полянка" style="width: 100%; box-sizing: border-box; margin-bottom: 12px;">

        <p style="margin-bottom: 4px;">Виды грибов (можно выбрать несколько)</p>
        <div id="search-types" style="margin-bottom: 12px;">
            {% for type in mushroom_types %}
                <label style="display: block; margin-bottom: 4px;">
                    <input type="checkbox" class="type-checkbox" value="{{ type.code }}"> {{ type.name }}
                </label>
            {% endfor %}
        </div>

        <p id="search-count" style="color: #555; font-size: 0.9em;"></p>

        <div id="search-results"></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map('map').setView([55.75, 37.62], 10); // старт: Москва и область

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        maxZoom: 19,
    }).addTo(map);

    let allSpots = []; // { data, marker }

    function buildPopup(spot) {
        const rating = spot.average_rating !== null ? spot.average_rating : '—';
        return `<b>${spot.title}</b><br>Автор: ${spot.author}<br>Виды: ${spot.mushroom_types_label}<br>` +
               `Рейтинг: ${rating} (${spot.ratings_count})<br>` +
               `<a href="/spots/${spot.id}/">Подробнее</a>`;
    }

    function getSelectedTypes() {
        return Array.from(document.querySelectorAll('.type-checkbox:checked')).map(cb => cb.value);
    }

    function applyFilters() {
        const text = document.getElementById('search-text').value.trim().toLowerCase();
        const selectedTypes = getSelectedTypes();
        let visibleCount = 0;
        const resultsBox = document.getElementById('search-results');
        resultsBox.innerHTML = '';

        allSpots.forEach(entry => {
            const matchesText = !text || entry.data.title.toLowerCase().includes(text);
            // "ИЛИ": показываем место, если оно содержит хотя бы один из отмеченных видов
            const matchesTypes = selectedTypes.length === 0 ||
                entry.data.mushroom_types.some(t => selectedTypes.includes(t));
            const visible = matchesText && matchesTypes;

            if (visible) {
                if (!map.hasLayer(entry.marker)) entry.marker.addTo(map);
                visibleCount += 1;

                const item = document.createElement('div');
                item.style.padding = '6px 0';
                item.style.borderBottom = '1px solid #eee';
                item.innerHTML = `<a href="/spots/${entry.data.id}/">${entry.data.title}</a><br>` +
                                  `<small>${entry.data.mushroom_types_label}</small>`;
                item.style.cursor = 'pointer';
                item.addEventListener('click', () => {
                    map.setView([entry.data.latitude, entry.data.longitude], 14);
                    entry.marker.openPopup();
                });
                resultsBox.appendChild(item);
            } else {
                if (map.hasLayer(entry.marker)) map.removeLayer(entry.marker);
            }
        });

        document.getElementById('search-count').textContent = `Найдено мест: ${visibleCount}`;
    }

    fetch("{% url 'spots:spots_api' %}")
        .then(response => response.json())
        .then(data => {
            data.spots.forEach(spot => {
                const marker = L.marker([spot.latitude, spot.longitude]).addTo(map);
                marker.bindPopup(buildPopup(spot));
                allSpots.push({ data: spot, marker: marker });
            });
            applyFilters();
        });

    document.getElementById('search-toggle').addEventListener('click', () => {
        document.getElementById('search-panel').style.display = 'block';
    });
    document.getElementById('search-close').addEventListener('click', () => {
        document.getElementById('search-panel').style.display = 'none';
    });
    document.getElementById('search-text').addEventListener('input', applyFilters);
    document.getElementById('search-types').addEventListener('change', applyFilters);
</script>
{% endblock %}
