<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Грибные места{% endblock %}</title>
    <script>
        // Применяем сохранённую тему до отрисовки страницы, чтобы избежать
        // мигания светлой темой перед переключением на тёмную.
        (function () {
            var theme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --panel-bg: #ffffff;
            --border: #e0e0e0;
            --nav-bg: #2e5339;
            --nav-text: #ffffff;
            --link: #2e5339;
            --muted: #666666;
        }
        :root[data-theme="dark"] {
            --bg: #15191c;
            --text: #e8e8e8;
            --panel-bg: #1f2428;
            --border: #3a3f43;
            --nav-bg: #1b3323;
            --nav-text: #f0f0f0;
            --link: #7fcf9a;
            --muted: #a0a0a0;
        }
        body { font-family: sans-serif; margin: 0; background: var(--bg); color: var(--text); }
        nav { padding: 10px 20px; background: var(--nav-bg); color: var(--nav-text); display: flex; gap: 16px; align-items: center; }
        nav a { color: var(--nav-text); text-decoration: none; }
        main { padding: 20px; }
        a { color: var(--link); }
        input, select, textarea, button { font-family: inherit; }

        .auth-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            box-sizing: border-box;
        }
        .auth-modal {
            position: relative;
            width: 360px;
            max-width: 100%;
            max-height: 100%;
            overflow-y: auto;
            background: var(--panel-bg);
            color: var(--text);
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            padding: 24px;
            box-sizing: border-box;
        }
        .auth-modal-close {
            position: absolute;
            top: 12px;
            right: 12px;
            border: none;
            background: none;
            font-size: 18px;
            cursor: pointer;
            color: var(--text);
        }
        .auth-modal-tabs {
            display: flex;
            gap: 8px;
            margin: 0 0 16px;
            border-bottom: 1px solid var(--border);
        }
        .auth-modal-tab {
            flex: 1;
            padding: 10px;
            border: none;
            background: none;
            color: var(--muted);
            font-size: 15px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
        }
        .auth-modal-tab.active {
            color: var(--text);
            font-weight: bold;
            border-bottom-color: var(--link);
        }
        .auth-modal-body form p { margin: 0 0 12px; }
        .auth-modal-body form label { display: block; margin-bottom: 4px; font-size: 0.9em; color: var(--muted); }
        .auth-modal-body form input {
            width: 100%;
            box-sizing: border-box;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg);
            color: var(--text);
        }
        .auth-modal-body form ul.errorlist {
            color: #c0392b;
            font-size: 0.85em;
            margin: 4px 0;
            padding-left: 18px;
        }
        .auth-modal-body form button[type="submit"] {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            background: var(--nav-bg);
            color: var(--nav-text);
            cursor: pointer;
            font-size: 15px;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'spots:map' %}">🍄 Грибные места</a>
        {% if user.is_authenticated %}
            <a href="{% url 'spots:spot_create' %}">Добавить место</a>
            <a href="{% url 'accounts:profile' %}">{{ user.username }} (рейтинг: {{ user.profile.rating }})</a>
            <form action="{% url 'accounts:logout' %}" method="post" style="display:inline;">
                {% csrf_token %}
                <button type="submit">Выйти</button>
            </form>
        {% else %}
            <a href="{% url 'accounts:login' %}" data-auth-open="login">Войти</a>
            <a href="{% url 'accounts:signup' %}" data-auth-open="signup">Регистрация</a>
        {% endif %}
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>

    {% if not user.is_authenticated %}
        <div id="auth-modal-overlay" class="auth-modal-overlay" style="display: none;">
            <div class="auth-modal" role="dialog" aria-modal="true">
                <button type="button" id="auth-modal-close" class="auth-modal-close" title="Закрыть">✕</button>
                <div class="auth-modal-tabs">
                    <button type="button" class="auth-modal-tab" data-auth-tab="login">Вход</button>
                    <button type="button" class="auth-modal-tab" data-auth-tab="signup">Регистрация</button>
                </div>
                <div id="auth-modal-body" class="auth-modal-body"></div>
            </div>
        </div>
        <script>
            (function () {
                const overlay = document.getElementById('auth-modal-overlay');
                const body = document.getElementById('auth-modal-body');
                const tabs = document.querySelectorAll('.auth-modal-tab');
                const urls = {
                    login: "{% url 'accounts:login' %}",
                    signup: "{% url 'accounts:signup' %}",
                };

                function setActiveTab(tab) {
                    tabs.forEach(btn => btn.classList.toggle('active', btn.dataset.authTab === tab));
                }

                function bindForm(tab) {
                    const form = body.querySelector('form');
                    if (!form) return;
                    form.addEventListener('submit', function (e) {
                        e.preventDefault();
                        const submitBtn = form.querySelector('button[type="submit"]');
                        if (submitBtn) submitBtn.disabled = true;
                        fetch(form.action, {
                            method: 'POST',
                            headers: { 'X-Panel-Request': '1' },
                            body: new FormData(form),
                        }).then(function (res) {
                            if (res.status === 204) {
                                window.location.reload();
                                return null;
                            }
                            return res.text();
                        }).then(function (html) {
                            if (html === null) return;
                            body.innerHTML = html;
                            bindForm(tab);
                        });
                    });
                }

                function loadForm(tab) {
                    setActiveTab(tab);
                    body.innerHTML = '<p>Загрузка…</p>';
                    fetch(urls[tab], { headers: { 'X-Panel-Request': '1' } })
                        .then(function (res) { return res.text(); })
                        .then(function (html) {
                            body.innerHTML = html;
                            bindForm(tab);
                        });
                }

                function openModal(tab) {
                    overlay.style.display = 'flex';
                    loadForm(tab);
                }

                function closeModal() {
                    overlay.style.display = 'none';
                    body.innerHTML = '';
                }

                document.querySelectorAll('[data-auth-open]').forEach(function (link) {
                    link.addEventListener('click', function (e) {
                        e.preventDefault();
                        openModal(link.dataset.authOpen);
                    });
                });

                tabs.forEach(function (btn) {
                    btn.addEventListener('click', function () { loadForm(btn.dataset.authTab); });
                });

                document.getElementById('auth-modal-close').addEventListener('click', closeModal);
                overlay.addEventListener('click', function (e) {
                    if (e.target === overlay) closeModal();
                });
                document.addEventListener('keydown', function (e) {
                    if (e.key === 'Escape' && overlay.style.display !== 'none') closeModal();
                });

                // Незалогиненным пользователям окно показывается сразу при заходе.
                openModal('login');
            })();
        </script>
    {% endif %}
</body>
</html>
