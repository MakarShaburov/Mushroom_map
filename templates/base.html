<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Грибные места{% endblock %}</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: sans-serif; margin: 0; }
        nav { padding: 10px 20px; background: #2e5339; color: white; display: flex; gap: 16px; align-items: center; }
        nav a { color: white; text-decoration: none; }
        main { padding: 20px; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'spots:map' %}">🍄 Грибные места</a>
        {% if user.is_authenticated %}
            <a href="{% url 'spots:spot_create' %}">Добавить место</a>
            <a href="{% url 'accounts:profile' %}">{{ user.username }} (рейтинг: {{ user.profile.rating }})</a>
            <form action="{% url 'accounts:logout' %}" method="post" style="display:inline;">
                {% csrf_token %}
                <button type="submit">Выйти</button>
            </form>
        {% else %}
            <a href="{% url 'accounts:login' %}">Войти</a>
            <a href="{% url 'accounts:signup' %}">Регистрация</a>
        {% endif %}
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
